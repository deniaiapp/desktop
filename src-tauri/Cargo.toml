[package]
name = "deni-ai-desktop"
version = "0.2.1"
description = "Tauri desktop shell for deniai.app"
authors = ["Deni AI"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "deni_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
