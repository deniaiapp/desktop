[package]
name = "deni-ai-desktop"
version = "0.3.1"
description = "Tauri desktop shell for deniai.app"
authors = ["Deni AI"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "deni_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "unstable"] }
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
os_info = { version = "3.15.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
